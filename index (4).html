<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Làng Vui Vẻ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-screen village canvas, floating rounded HUD cards, one big action button, a shop sheet and a phone with apps. */
:root {
  --ink: #23324a;
  --muted: #5d6b82;
  --sun: #ffd23f;
  --sky: #5ab0ff;
  --coral: #ff7a6b;
  --grass: #86cf8e;
  --card: rgba(255, 255, 255, .94);
  --line: rgba(35, 50, 74, .14);
  --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--grass); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; display: flex; gap: 8px; align-items: stretch; z-index: 3; }
.top-left { top: 12px; left: 12px; flex-direction: column; align-items: flex-start; }
.top-right { top: 12px; right: 12px; flex-direction: column; align-items: flex-end; }
.title { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1; color: #fff; text-shadow: 0 2px 0 rgba(35, 50, 74, .35); padding-left: 4px; }
.row { display: flex; gap: 8px; }
.coins, .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 3px 0 rgba(35, 50, 74, .12); font-family: var(--display); font-weight: 800; font-size: 1.1rem; color: var(--ink); }
.coin { width: 18px; height: 18px; border-radius: 50%; background: var(--sun); border: 2px solid #e0a800; box-shadow: inset 0 0 0 3px #ffe58a; }
.pill { cursor: pointer; font-size: 1rem; position: relative; }
.pill.soft { cursor: default; font-weight: 600; font-family: var(--body); font-size: .85rem; }
.pill:focus-visible, .emotes button:focus-visible, .sheet button:focus-visible, .phone button:focus-visible, .intro button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#bagN { background: var(--coral); color: #fff; border-radius: 99px; min-width: 22px; padding: 0 6px; font-size: .85rem; text-align: center; }
.phonebtn svg { width: 18px; height: 18px; }
.notif-badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: #ff4757; color: #fff; font-family: var(--body); font-size: .72rem; font-weight: 800; display: grid; place-items: center; border: 2px solid #fff; }
.notif-badge[hidden] { display: none; }
#toasts { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: min(92%, 420px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 8; }
.toast { padding: 8px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-size: .9rem; line-height: 1.35; text-align: center; animation: pop 2.6s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(-8px); } 10%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.emotes { position: absolute; left: 12px; bottom: 72px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.emotes button { padding: 8px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 3px 0 rgba(35, 50, 74, .12); font-family: var(--display); font-weight: 800; font-size: .95rem; color: var(--ink); cursor: pointer; }
.act { position: absolute; right: 16px; bottom: 72px; width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; background: var(--sun); box-shadow: 0 5px 0 #d9a900, 0 10px 24px rgba(35, 50, 74, .25); color: #3a2a00; font-family: var(--display); font-weight: 800; font-size: 1.25rem; line-height: 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 3; padding: 0 6px; }
.act small { font-family: var(--body); font-weight: 400; font-size: .65rem; opacity: .7; margin-top: 2px; }
.act:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9a900; }
.act.reel { background: var(--coral); color: #fff; box-shadow: 0 5px 0 #c9483a; animation: pulse .35s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

/* Bottom Main Screen Chat Bar */
.chat-dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(520px, calc(100vw - 24px)); z-index: 4; display: flex; flex-direction: column; gap: 6px; }
.chat-feed { max-height: 112px; overflow-y: auto; padding: 8px 12px; border-radius: 16px; background: rgba(25, 36, 54, .76); backdrop-filter: blur(6px); color: #fff; font-size: .82rem; line-height: 1.4; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
.chat-feed[hidden] { display: none; }
.chat-line { word-break: break-word; }
.chat-line b { color: #ffd23f; font-weight: 700; }
.chat-line .chat-zone { font-size: .72rem; color: #a7c5eb; margin-right: 4px; }
.chat-bar { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(35, 50, 74, .18); }
.chat-toggle { border: 0; background: #eef2f7; color: var(--ink); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; font-size: .85rem; font-weight: 800; }
.chat-inp { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: .92rem; color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
.chat-send { border: 0; border-radius: 99px; padding: 7px 14px; background: var(--sky); color: #fff; font-family: var(--display); font-weight: 800; font-size: .9rem; cursor: pointer; flex: none; }
.chat-send:active { transform: scale(.96); }

.modal { position: absolute; inset: 0; z-index: 6; display: flex; align-items: flex-end; justify-content: center; background: rgba(35, 50, 74, .45); }
.modal[hidden] { display: none; }
.sheet { width: min(560px, 100%); max-height: 86%; display: flex; flex-direction: column; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
@media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 22px; max-height: 80%; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #eef2f7; font-size: 1.2rem; cursor: pointer; color: var(--ink); }
.tabs { display: flex; gap: 6px; padding: 0 18px 10px; }
.tab { flex: 1; padding: 8px 6px; border-radius: 12px; border: 1px solid var(--line); background: #f5f8fb; font-family: var(--display); font-weight: 800; font-size: .95rem; color: var(--muted); cursor: pointer; position: relative; }
.tab[aria-selected="true"] { background: var(--sky); border-color: var(--sky); color: #fff; }
.body { overflow-y: auto; padding: 4px 18px 18px; display: grid; gap: 8px; align-content: start; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #f5f8fb; border: 1px solid var(--line); }
.chip { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(35, 50, 74, .18); position: relative; }
.status-dot { position: absolute; bottom: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; background: #9aa5b4; }
.status-dot.on { background: #2ed573; }
.item .name { flex: 1; font-weight: 600; line-height: 1.3; min-width: 0; }
.item .name small { display: block; font-weight: 400; color: var(--muted); }
.btn { padding: 8px 12px; border-radius: 12px; border: 0; background: var(--sky); color: #fff; font-family: var(--display); font-weight: 800; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.btn.sun { background: var(--sun); color: #3a2a00; }
.btn.ghost { background: #e3e9f1; color: var(--ink); }
.btn.green { background: #3fae6a; }
.btn.red { background: #ff5e57; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.empty { margin: 8px 0; color: var(--muted); line-height: 1.5; font-size: .9rem; }
.sell { width: 100%; padding: 12px; font-size: 1.1rem; }

/* phone */
.phone { width: min(370px, 94vw); height: min(660px, 92%); display: flex; flex-direction: column; background: #1c2638; border-radius: 38px; padding: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); align-self: center; }
.pbar { display: flex; justify-content: space-between; padding: 4px 18px 8px; color: #cfe0f5; font-size: .78rem; font-weight: 600; }
.pscreen { flex: 1; min-height: 0; overflow-y: auto; background: linear-gradient(180deg, #d9f0ff 0%, #f7fbff 55%); border-radius: 26px; padding: 14px; }
.pnav { display: flex; justify-content: space-between; gap: 6px; padding: 10px 6px 2px; }
.pnav button { flex: 1; padding: 8px 4px; border-radius: 99px; border: 0; background: #2c3a52; color: #e6f0ff; font-family: var(--body); font-weight: 600; font-size: .8rem; cursor: pointer; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; padding-top: 12px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; font-family: var(--body); font-weight: 600; font-size: .78rem; color: var(--ink); padding: 0; position: relative; }
.app i { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(35, 50, 74, .18); position: relative; }
.app svg { width: 34px; height: 34px; }
.ph1 { margin: 0 0 10px; font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
.pgrid { display: grid; gap: 8px; }
.card { padding: 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.hearts { letter-spacing: 2px; color: #ff5d8f; font-size: .95rem; }
.hearts .off { color: #cfd8e3; }
.bar { height: 10px; border-radius: 99px; background: #e3e9f1; overflow: hidden; }
.bar b { display: block; height: 100%; background: linear-gradient(90deg, #5ab0ff, #3fae6a); border-radius: 99px; }
.inp { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font: inherit; font-size: .95rem; color: var(--ink); background: #fff; user-select: text; -webkit-user-select: text; }
.inp:focus-visible { outline: 3px solid var(--sky); outline-offset: 1px; }
.kv { display: flex; justify-content: space-between; padding: 5px 0; font-size: .9rem; border-bottom: 1px dashed var(--line); }
.kv:last-child { border: 0; }
.prof { display: flex; gap: 12px; align-items: center; }
.prof canvas { position: static; width: 96px; height: 112px; border-radius: 16px; background: linear-gradient(180deg, #bfe6ff, #e9f7d8); flex: none; }
.lbl { font-size: .8rem; color: var(--muted); margin: 8px 0 4px; display: block; font-weight: 700; }
.ptabs { display: flex; gap: 6px; margin-bottom: 10px; }
.ptab { flex: 1; padding: 7px 4px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-family: var(--display); font-weight: 800; font-size: .82rem; color: var(--muted); cursor: pointer; position: relative; }
.ptab.on { background: var(--sky); border-color: var(--sky); color: #fff; }
.search-row { display: flex; gap: 6px; margin-bottom: 10px; }

/* Play Together style splash & loading intro */
#ptg-intro-wrap { position: fixed; inset: 0; z-index: 200; font-family: "Be Vietnam Pro", var(--body); }
#ptg-intro-wrap[hidden] { display: none; }
#ptg-splash-studio { position: fixed; inset: 0; background: #ffffff; z-index: 202; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.55s ease, visibility 0.55s ease; }
.ptg-studio-logo { font-family: var(--display); font-size: 38px; font-weight: 800; color: #2c3e50; letter-spacing: 2px; animation: ptgPopIn 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
.ptg-studio-sub { margin-top: 6px; font-size: 13px; font-weight: 800; color: #7f8c8d; letter-spacing: 3px; text-transform: uppercase; opacity: 0; animation: ptgFadeIn 0.6s ease 0.35s forwards; }
#ptg-intro-screen { position: fixed; inset: 0; z-index: 201; background: linear-gradient(180deg, #4facfe 0%, #00f2fe 65%, #7bed9f 65.5%, #2ed573 100%); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px 36px; transition: transform 0.55s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.45s ease; }
#ptg-intro-screen.hide { opacity: 0; transform: scale(1.07); pointer-events: none; }
.ptg-cloud { position: absolute; background: rgba(255, 255, 255, 0.86); border-radius: 50px; animation: ptgFloatCloud linear infinite; pointer-events: none; }
.ptg-cloud::before, .ptg-cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
.ptg-cloud-1 { width: 120px; height: 40px; top: 13%; left: -150px; animation-duration: 22s; }
.ptg-cloud-1::before { width: 55px; height: 55px; top: -25px; left: 18px; }
.ptg-cloud-1::after { width: 40px; height: 40px; top: -15px; right: 20px; }
.ptg-cloud-2 { width: 90px; height: 30px; top: 25%; left: -120px; animation-duration: 30s; animation-delay: 4s; }
.ptg-cloud-2::before { width: 40px; height: 40px; top: -18px; left: 14px; }
.ptg-logo-wrapper { margin-top: 6vh; text-align: center; z-index: 2; animation: ptgBounceLogo 2.5s ease-in-out infinite; }
.ptg-badge { display: inline-block; background: #ff4757; color: #fff; font-size: 13px; font-weight: 900; padding: 4px 14px; border-radius: 20px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15); margin-bottom: 8px; text-transform: uppercase; }
.ptg-title { margin: 0; font-family: var(--display); font-size: clamp(42px, 8vw, 68px); font-weight: 800; color: #ffdd59; line-height: 1.05; text-transform: uppercase; -webkit-text-stroke: 3px #2f3542; text-shadow: 0 6px 0 #2f3542, 0 10px 20px rgba(0, 0, 0, 0.25); }
.ptg-title span { display: block; color: #ffffff; font-size: clamp(32px, 6.2vw, 52px); }
.ptg-bottom { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
.ptg-tip { background: rgba(255, 255, 255, 0.92); color: #2f3542; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 800; margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); text-align: center; }
.ptg-loading-box { width: 100%; background: #2f3542; padding: 5px; border-radius: 30px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2); position: relative; }
.ptg-bar-bg { width: 100%; height: 24px; background: #57606f; border-radius: 20px; overflow: hidden; position: relative; }
.ptg-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffdd59, #ffa801); border-radius: 20px; transition: width 0.2s ease; position: relative; }
.ptg-bar-fill::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.35) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0.35) 75%, transparent 75%, transparent); background-size: 24px 24px; animation: ptgMoveStripes 0.8s linear infinite; }
.ptg-bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 13px; font-weight: 900; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
.ptg-tap-start { display: none; margin-top: 10px; font-family: var(--display); font-size: 22px; font-weight: 800; color: #ffffff; text-transform: uppercase; -webkit-text-stroke: 1.5px #2f3542; text-shadow: 0 4px 0 #2f3542; cursor: pointer; animation: ptgPulseText 1.2s ease-in-out infinite; }
.ptg-ver { position: absolute; top: 14px; right: 18px; font-size: 12px; font-weight: 800; color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
@keyframes ptgPopIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes ptgFadeIn { to { opacity: 1; } }
@keyframes ptgFloatCloud { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 300px)); } }
@keyframes ptgBounceLogo { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
@keyframes ptgMoveStripes { 0% { background-position: 0 0; } 100% { background-position: 24px 0; } }
@keyframes ptgPulseText { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.82; } }

/* intro, fade, banner */
.intro { position: absolute; inset: 0; z-index: 9; background: #bfe6ff; transition: opacity .6s ease; }
.intro[hidden] { display: none; }
.intro.out { opacity: 0; pointer-events: none; }
.intro canvas { position: absolute; inset: 0; }
.skip { position: absolute; top: 14px; right: 14px; z-index: 2; padding: 8px 16px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .85); font-family: var(--body); font-weight: 600; font-size: .85rem; color: var(--ink); cursor: pointer; }
.istage { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 16px; z-index: 1; }
.icard { width: min(480px, 100%); padding: 22px 22px 18px; border-radius: 24px; background: rgba(255, 255, 255, .95); box-shadow: 0 12px 40px rgba(35, 50, 74, .25); animation: rise .5s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.icard h1 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: 1.05; color: var(--coral); text-wrap: balance; }
.icard p { margin: 0 0 14px; color: var(--muted); line-height: 1.55; }
.dots { display: flex; gap: 6px; margin-bottom: 14px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #d3dce8; }
.dots i.on { background: var(--coral); width: 22px; border-radius: 99px; }
.swatches { display: flex; gap: 10px; margin: 8px 0 14px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.go { width: 100%; padding: 13px; border: 0; border-radius: 14px; background: var(--coral); color: #fff; font-family: var(--display); font-weight: 800; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 0 #c9483a; }
#fade { position: absolute; inset: 0; background: #0b1624; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 7; }
#fade.on { opacity: 1; }
#banner { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none; font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 3rem); color: #fff; text-shadow: 0 3px 0 rgba(35, 50, 74, .4), 0 0 24px rgba(35, 50, 74, .35); opacity: 0; white-space: nowrap; }
#banner.show { animation: ban 2.4s ease forwards; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (max-width: 480px) { .act { width: 84px; height: 84px; font-size: 1.1rem; } .icard h1 { font-size: 1.8rem; } }
@media (prefers-reduced-motion: reduce) { .toast, #banner.show { animation-duration: 3s; } .act.reel, .icard, .ptg-logo-wrapper, .ptg-tap-start { animation: none; } }
/* firebase live features */
#srvBanner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; max-width: min(520px, calc(100vw - 290px)); padding: 6px 16px; border-radius: 99px; background: linear-gradient(90deg, #ff7a6b, #ff9f43); color: #fff; font-family: var(--display); font-weight: 800; font-size: .9rem; box-shadow: 0 4px 14px rgba(255,122,107,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
#srvBanner[hidden] { display: none; }
#maintOverlay { position: fixed; inset: 0; z-index: 300; background: rgba(28, 38, 56, .92); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; }
#maintOverlay[hidden] { display: none; }
.maint-card { max-width: 420px; width: 100%; background: #fff; border-radius: 24px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.maint-card h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: 1.7rem; color: var(--coral); }
.maint-card p { margin: 0; color: var(--muted); line-height: 1.55; }
.mail-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff4757; margin-left: 4px; vertical-align: middle; }
@media (max-width: 680px) { #srvBanner { top: 58px; max-width: 92vw; } }

/* Mobile playability and safe-area support */
:root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
button, input { touch-action: manipulation; }
#app { min-height: 100%; }
.hud.top-left { top: calc(10px + var(--safe-top)); left: calc(10px + var(--safe-left)); }
.hud.top-right { top: calc(10px + var(--safe-top)); right: calc(10px + var(--safe-right)); }
.chat-dock { bottom: calc(10px + var(--safe-bottom)); }
.act { right: calc(14px + var(--safe-right)); bottom: calc(82px + var(--safe-bottom)); touch-action: manipulation; }
